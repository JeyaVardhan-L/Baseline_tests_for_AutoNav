name: pages

# Builds the static showcase from the committed site/public/data and deploys it to GitHub Pages.
# The Python pipeline is not needed here: the site only renders exported artifacts.
on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install
        run: npm ci
        working-directory: site
      - name: Build (showcase mode: static, read-only)
        run: npm run build
        working-directory: site
        env:
          SITE_BASE: /Baseline_tests_for_AutoNav/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4