[project]
name = "iroc-u-navigation"
version = "0.1.0"
description = "IRoC-U Autonomous UAV Navigation — Sensor and Computational Feasibility Study"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
viz = [
    "open3d>=0.17",
]
analysis = [
    "pandas>=2.0",
    "scipy>=1.10",
]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
