[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonav_baseline"
version = "0.1.0"
description = "Baseline Tests for Autonomous Navigation — Sensor & Computational Feasibility Study"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Autonomous Navigation Team"}
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = [
    "open3d>=0.17",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
